<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse ASIMSAADZ engineering notes by subject.">
  <link rel="icon" type="image/png" href="ASIM.ico">
  <link rel="stylesheet" href="styles.css">
  <title>Notes Library - ASIMSAADZ</title>
</head>
<body data-page="notes">
  <div class="site-shell">
    <header class="site-header" data-header></header>

    <main>
      <section class="hero">
        <div class="container">
          <p class="eyebrow">Notes library</p>
          <h1>All subjects, cleaner access.</h1>
          <p class="lead">Search by subject or topic, then open the subject page for notes, assignments, question papers, blogs, and video references.</p>
          <div class="notes-toolbar">
            <input class="search-box" type="search" placeholder="Search subjects, topics, papers..." data-notes-search>
            <a class="btn secondary" href="index.html">Home</a>
          </div>
        </div>
      </section>

      <section class="section compact">
        <div class="wide-container">
          <div class="subject-grid" data-subject-grid></div>
          <div class="empty-state" data-empty>No subject matched your search.</div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-footer></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
